name: Check dataset links

on:
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/check-links.yml'
      - '.github/scripts/**'

permissions:
  contents: read

concurrency:
  group: check-links
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s .github/scripts -p 'test_*.py' -v

  check:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'
      - name: Check links and update the maintenance issue
        run: python .github/scripts/check_links.py --report "$RUNNER_TEMP/link-report.md" --publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
      - name: Add report to the run summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/link-report.md" ]; then
            cat "$RUNNER_TEMP/link-report.md" >> "$GITHUB_STEP_SUMMARY"
          fi
